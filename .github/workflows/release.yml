name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  # The build signs the image keyless; a called workflow gets no more than this.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      # The service's own tag (v1.2.3); empty when only the reader released.
      tag: ${{ steps.service.outputs.tag }}
    steps:
      # The branch tip, not the pushed commit: a run queued behind another
      # release must see that release's version commit and tags.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - id: release
        uses: dsswift/release-damnit@v1.9.2
        with:
          since-last-release: 'true'
          publish: 'true'
      # The reader module releases on its own, tagged reader/v1.2.3 for Go.
      # Only the service's bare tag builds an image.
      - id: service
        env:
          TAGS: ${{ steps.release.outputs.tags }}
        run: |
          tag=""
          for t in $TAGS; do
            case "$t" in v*) tag=$t ;; esac
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.tag != ''
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
